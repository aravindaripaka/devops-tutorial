name: CI/CD Pipeline

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: myapp

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest testserver.py -v --cov=server --cov-report=xml


      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: Lint and Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8 bandit

      - name: Run flake8 (style)
        run: flake8 server.py --max-line-length=100

      - name: Run bandit (security)
        run: bandit -r server.py -ll

  build:
    name: Build and Scan Image
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d -p 5000:5000 --name myapp \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health
          curl -f http://localhost:5000/metrics
          docker stop myapp

  deploy:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy
        run: |
          echo "Deploying commit ${{ github.sha }} to staging..."
          echo "In production: kubectl set image deployment/myapp \
            myapp=registry/myapp:${{ github.sha }}"
          echo "Deploy complete."